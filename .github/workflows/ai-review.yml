name: AI review

# AI-assisted code review with Claude Code (QA Manual 3.2, practice AI3). It comments on the
# PR; it never approves or merges, and it does not replace the human approval.
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude Code review
    # Drafts are reviewed when marked ready; Dependabot and fork PRs have no access to secrets.
    if: >-
      github.event.pull_request.draft == false
      && github.actor != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Authentication: the review is paid by whoever opens the pull request, with the Claude
    # Pro/Max OAuth token (`claude setup-token`) stored in that person's own secret. With no
    # secret for the author, the review is skipped and nobody else's token is used.
    env:
      CLAUDE_CODE_OAUTH_TOKEN: >-
        ${{
          github.event.pull_request.user.login == 'SimaoPinto999' && secrets.CLAUDE_TOKEN_SIMAO
          || github.event.pull_request.user.login == 'xutaa' && secrets.CLAUDE_TOKEN_RODRIGO
          || github.event.pull_request.user.login == 'dino3111' && secrets.CLAUDE_TOKEN_CLAUDINO
          || github.event.pull_request.user.login == 'goncalovila' && secrets.CLAUDE_TOKEN_VILA
          || ''
        }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load the review prompt
        id: prompt
        run: |
          {
            echo "text<<PROMPT_EOF"
            sed '1,/^---$/d' .github/ai-review/prompt.md
            echo
            echo "REPO: ${{ github.repository }}"
            echo "PR NUMBER: ${{ github.event.pull_request.number }}"
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Skip when no credential is set
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN == '' }}
        run: echo "::warning::No Claude token is configured for the pull request author (${{ github.event.pull_request.user.login }}); the AI review was skipped."

      - name: Review with Claude Code
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
