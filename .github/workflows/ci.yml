name: CI

on:
  push:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      # Secrets are not available to Dependabot or fork PRs; the steps that need them are skipped.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
      XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar needs full history to detect new code

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      - name: Build and run tests
        run: ./mvnw --batch-mode verify

      - name: Sonar analysis and quality gate
        # Pull requests (the gate) and the long-lived branches (the dashboard); feature-branch pushes are covered by their PR.
        if: >-
          ${{ env.SONAR_TOKEN != ''
          && (github.event_name == 'pull_request'
          || github.ref == 'refs/heads/develop'
          || github.ref == 'refs/heads/main') }}
        run: >-
          ./mvnw --batch-mode org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=true

      - name: Import test results into Xray
        # One Test Execution per merge into develop; main only receives code already tested there.
        if: >-
          ${{ always()
          && github.event_name == 'push'
          && github.ref == 'refs/heads/develop'
          && env.XRAY_CLIENT_ID != ''
          && env.XRAY_CLIENT_SECRET != '' }}
        run: ../.github/scripts/xray-import.sh

  web:
    name: Web UI build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Type-check and build
        run: npm run build
