name: CI

on:
  push:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      # Secrets are not available to Dependabot or fork PRs; the steps that need them are skipped.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
      XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar needs full history to detect new code

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      - name: Build and run tests
        run: ./mvnw --batch-mode verify

      - name: Debug secret shape
        run: |
          for n in SONAR_TOKEN XRAY_CLIENT_ID XRAY_CLIENT_SECRET; do
            v="${!n}"
            echo "$n length=${#v} nonprintable=$(printf '%s' "$v" | tr -d '[:print:]' | wc -c) spaces=$(printf '%s' "$v" | tr -cd ' ' | wc -c)"
          done

      - name: Sonar analysis and quality gate
        if: ${{ env.SONAR_TOKEN != '' }}
        run: >-
          ./mvnw --batch-mode org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=true

      - name: Import test results into Xray
        if: ${{ always() && env.XRAY_CLIENT_ID != '' && env.XRAY_CLIENT_SECRET != '' }}
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          merged = ET.Element("testsuites")
          for path in glob.glob("target/surefire-reports/TEST-*.xml") + glob.glob("target/failsafe-reports/TEST-*.xml"):
              merged.append(ET.parse(path).getroot())
          ET.ElementTree(merged).write("target/xray-junit.xml")
          PY
          code=$(curl --silent --show-error -o target/xray-auth.txt -w '%{http_code}' -X POST \
            -H "Content-Type: application/json" \
            --data "{\"client_id\":\"$XRAY_CLIENT_ID\",\"client_secret\":\"$XRAY_CLIENT_SECRET\"}" \
            https://xray.cloud.getxray.app/api/v2/authenticate)
          if [ "$code" != "200" ]; then
            echo "::error::Xray authenticate failed: HTTP $code"; cat target/xray-auth.txt; exit 1
          fi
          token=$(tr -d '"' < target/xray-auth.txt)
          code=$(curl --silent --show-error -o target/xray-import.txt -w '%{http_code}' -X POST \
            -H "Content-Type: text/xml" \
            -H "Authorization: Bearer $token" \
            --data @target/xray-junit.xml \
            "https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=BRK")
          cat target/xray-import.txt; echo
          if [ "$code" != "200" ]; then
            echo "::error::Xray import failed: HTTP $code"; exit 1
          fi

  web:
    name: Web UI build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type-check and build
        run: npm run build

  jira-key:
    name: Jira key in branch and PR title
    # Release PRs (develop -> main) and Dependabot updates have no story key.
    if: >-
      github.event_name == 'pull_request'
      && github.head_ref != 'develop'
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name and PR title
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          status=0
          if ! [[ "$BRANCH" =~ ^(feature/|fix/)?BRK-[0-9]+- ]]; then
            echo "::error::Branch name '$BRANCH' must contain the Jira key, e.g. feature/BRK-12-short-description"
            status=1
          fi
          if ! [[ "$TITLE" =~ ^BRK-[0-9]+[[:space:]] ]]; then
            echo "::error::PR title '$TITLE' must start with the Jira key, e.g. 'BRK-12 Add dock availability'"
            status=1
          fi
          exit $status
