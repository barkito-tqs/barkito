name: Dependency check

# OWASP Dependency-Check on the backend (Q3, QA Manual 3.4). Fails on CVSS >= 9.
# Dependabot covers the npm and GitHub Actions dependencies.
on:
  pull_request:
    branches: [develop, main]
    paths:
      - backend/pom.xml
      - backend/dependency-check-suppressions.xml
      - .github/workflows/dependency-check.yml
  push:
    branches: [develop, main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, catches new CVEs in unchanged dependencies
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache the vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dependency-check-${{ runner.os }}-

      - name: Warn when the NVD API key is missing
        if: ${{ env.NVD_API_KEY == '' }}
        run: echo "::warning::NVD_API_KEY secret is not set; the NVD download is slow and may be rate-limited."

      - name: Run Dependency-Check
        run: ./mvnw --batch-mode org.owasp:dependency-check-maven:check

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.*
