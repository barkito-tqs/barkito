name: barkito

services:
  backend:
    build: ./backend
    # No profile is set, so the backend runs the default "dev" profile, which accepts
    # tokens signed with the dev secret committed in the repository. Fine on a laptop;
    # a deployed environment must set SPRING_PROFILES_ACTIVE to a non-dev profile.
    # The dev profile also seeds the six docks the web UI uses (DevDockSeeder).
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # dps vem o postgre e tals
  
  web:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
